name: Template first use

# Runs once in a repository created from this template: renames the placeholder package after the
# repository, writes the project's README, and removes the template-only files, this workflow included.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    if: ${{ !github.event.repository.is_template && github.event.repository.name != 'moderncpp' }}
    runs-on: ubuntu-24.04
    env:
      REPOSITORY: ${{ github.repository }}
      NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Rename the package after the repository
        run: python3 scripts/rename.py "$NAME" --repo "$REPOSITORY"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename the template package after $NAME"
          git push
