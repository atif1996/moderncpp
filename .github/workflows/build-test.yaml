name: Build&Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.linkage }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        linkage: [static, shared]
    defaults:
      run:
        shell: bash
    env:
      SHARED: ${{ matrix.linkage == 'shared' && 'True' || 'False' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
      - name: Build and test
        run: conan build . -s compiler.cppstd=20 -o "&:shared=$SHARED" -c user.packagename:werror=True --build=missing
      - name: Package and build the consumer project
        run: conan create . -s compiler.cppstd=20 -o "packagename/*:shared=$SHARED" --build=missing

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Conan and clang-tidy
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
          sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: clang-tidy
        run: |
          conan install . -s compiler.cppstd=20 --build=missing
          cmake --preset conan-release -DpackageName_CLANG_TIDY=ON
          cmake --build --preset conan-release
